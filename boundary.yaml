# The gateway configuration every model call in this project goes through (04's boundary).
# Routes are the models in docs/models.md, chosen 2026-10-16 from the gateway's price file of
# that date. Keys are read from the environment, never from a file here.
version: 1
prices: builtin
caps: caps.yaml
providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens_field: max_completion_tokens
    # api.openai.com serves /v1/batches; an OpenAI-compatible entry must say so itself.
    batches: true
  google:
    kind: google
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GOOGLE_API_KEY
    api_version: v1beta
  # Arm F (2026-10-24): Azure AI Document Intelligence, this project's resource in East US. An
  # analysis is asynchronous, so the gateway serves it as batches of one document (boundary
  # 1.6). Custom models are named explicitly, `azure-docintel/custom/<modelId>`.
  azure-docintel:
    kind: azure_docintel
    base_url: https://legible-docintel.cognitiveservices.azure.com
    api_key_env: AZURE_DOCINTEL_KEY
    api_version: "2024-11-30"
routes:
  quality:
    provider: anthropic
    model: claude-sonnet-5-5
  anchor:
    provider: anthropic
    model: claude-haiku-5-5
  ceiling:
    provider: anthropic
    model: claude-opus-5-5
  openai:
    provider: openai
    model: gpt-6.1-sol
  google:
    provider: google
    model: gemini-3.8-flash
  docintel-receipt:
    provider: azure-docintel
    model: prebuilt/prebuilt-receipt
  docintel-layout:
    provider: azure-docintel
    model: prebuilt/prebuilt-layout
ledger:
  path: data/ledger.sqlite
# The development cache holds public data only, which is all this project sends; it stays
# off for measured runs, which are never served from a cache.
cache:
  enabled: false
