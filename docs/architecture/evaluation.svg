<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="996" viewBox="0 0 1236 996" role="img" aria-label="Dev carve-outs from VRDU and CORD are the only pages prompts and confidence thresholds may see; the unseen-template VRDU test carries the headline and the mixed-template test the gap; NIST is split by simulated submission with a leakage check and its 300 degraded pages carry the degradation curve; each test set is run once per arm, bootstrapped over documents, gated per corpus, and the review rate is read at 99 percent." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
