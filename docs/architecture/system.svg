<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="1180" viewBox="0 0 1236 1180" role="img" aria-label="Public pages are fetched with their licences quoted, rendered, split and degraded to five levels; five arms read the same pages, the frontier and OCR-to-model arms through the gateway and the fine-tuned models served as gateway hosts; one grader scores every field, the review rate, the verifier, the cost per page and the release gate are computed from the outcomes, and the report writes the tables and the static site." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
