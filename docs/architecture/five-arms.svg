<path d="M 768.0 306.0 L 832.0 306.0 Q 838.0 306.0 838.0 312.0 L 838.0 390.7 Q 838.0 396.7 844.0 396.7 L 908.0 396.7" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 768.0 410.0 L 908.0 410.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 768.0 514.0 L 832.0 514.0 Q 838.0 514.0 838.0 508.0 L 838.0 429.3 Q 838.0 423.3 844.0 423.3 L 908.0 423.3" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
