<path d="M 328.0 440.0 L 392.0 440.0 Q 398.0 440.0 398.0 446.0 L 398.0 612.0 Q 398.0 618.0 404.0 618.0 L 468.0 618.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
