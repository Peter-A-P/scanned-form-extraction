<text x="178.0" y="395.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">One page image, level 0 to 4</text>
<text x="178.0" y="411.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">with its corpus schema: fields,</text>
<text x="178.0" y="427.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">types, matchers, nesting</text>
<text x="178.0" y="444.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">one schema: prompt, targets, grader</text>
<rect x="468.0" y="169.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="618.0" y="190.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">A: frontier vision</text>
<text x="618.0" y="206.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">image block, instruction, schema;</text>
<text x="618.0" y="222.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">via the gateway; JSON</text>
<rect x="468.0" y="273.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<rect x="468.0" y="273.0" width="5" height="66.0" rx="2" fill="#0E6E60"/>
<text x="618.0" y="294.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">B: fine-tuned small vision</text>
<text x="618.0" y="310.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">image at 1120 or 560 visual tokens; Gemma 4</text>
<text x="618.0" y="326.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">E2B/E4B + QLoRA; JSON + per-field confidence</text>
<rect x="468.0" y="377.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="618.0" y="398.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">C: untuned small vision</text>
<text x="618.0" y="414.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">same input, zero- or few-shot;</text>
<text x="618.0" y="430.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Gemma 4 E2B/E4B -it; JSON</text>
<rect x="468.0" y="481.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="618.0" y="502.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">D: OCR text to a language model</text>
<text x="618.0" y="518.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Tesseract hOCR, positioned text; the same</text>
<text x="618.0" y="534.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">frontier model as A, text only; JSON</text>
<rect x="468.0" y="585.0" width="300.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="618.0" y="606.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">E: OCR plus rules</text>
<text x="618.0" y="622.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Tesseract hOCR; per-template anchors and</text>
<text x="618.0" y="638.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">patterns (training templates); JSON or blank</text>
<rect x="908.0" y="370.0" width="300.0" height="80.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="908.0" y="370.0" width="5" height="80.0" rx="2" fill="#A64C1C"/>
<text x="1058.0" y="391.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The grader</text>
<text x="1058.0" y="407.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">per field: right, wrong field, wrong value,</text>
<text x="1058.0" y="423.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">blank filled, invented, malformed</text>
<text x="1058.0" y="440.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">legible.grade</text>
<path d="M 908.0 588.0 a 150.0 7 0 0 1 300.0 0 L 1208.0 648.0 a 150.0 7 0 0 1 -300.0 0 Z" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/><path d="M 908.0 588.0 a 150.0 7 0 0 0 300.0 0" fill="none" stroke="#14201E" stroke-width="1.1"/>
<text x="1058.0" y="611.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Outcomes per document</text>
<text x="1058.0" y="627.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">and document-level all-right</text>
<text x="1058.0" y="644.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">data/runs</text>
<rect x="346.0" y="281.0" width="104.1" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="398.0" y="293.0" font-size="12" text-anchor="middle" fill="#14201E">page and schema</text>
<rect x="776.0" y="272.7" width="124.0" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="838.0" y="284.7" font-size="12" text-anchor="middle" fill="#14201E">JSON from every arm</text>
<rect x="992.3" y="505.5" width="131.4" height="20.0" rx="3" fill="#FFFFFF"/>
<text x="1058.0" y="517.5" font-size="12" text-anchor="middle" fill="#14201E">per field, per document</text>
<rect x="28" y="672" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<text x="62" y="684" font-size="11" fill="#5C6B67">the model trained here</text>
<rect x="206.57999999999998" y="672" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<text x="240.57999999999998" y="684" font-size="11" fill="#5C6B67">the one grader</text>
<path d="M 342.0 679.0 a 13.0 7 0 0 1 26.0 0 L 368.0 681.0 a 13.0 7 0 0 1 -26.0 0 Z" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/><path d="M 342.0 679.0 a 13.0 7 0 0 0 26.0 0" fill="none" stroke="#14201E" stroke-width="1.1"/>
<text x="376.03999999999996" y="684" font-size="11" fill="#5C6B67">data at rest</text>
</svg>