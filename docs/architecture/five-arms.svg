<svg xmlns="http://www.w3.org/2000/svg" width="1236" height="708" viewBox="0 0 1236 708" role="img" aria-label="One page image at a degradation level, with its corpus schema, is read five ways: a frontier vision model through the gateway, the fine-tuned small vision model, the same model untuned, OCR text to the frontier model, and OCR with per-template rules; one grader scores every field of every arm the same way." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#14201E"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#0E6E60"/></marker><marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#A64C1C"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#5C6B67"/></marker></defs>
<rect width="1236" height="708" fill="#FFFFFF"/>
<text x="28" y="42" font-size="16" font-weight="700" fill="#14201E">One page through the five arms</text>
<path d="M 328.0 380.0 L 392.0 380.0 Q 398.0 380.0 398.0 374.0 L 398.0 208.0 Q 398.0 202.0 404.0 202.0 L 468.0 202.0" fill="none" stroke="#14201E" stroke-width="1.4" marker-end="url(#arrow)"/>
